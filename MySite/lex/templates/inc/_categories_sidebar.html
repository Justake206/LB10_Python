<!-- lex/templates/inc/_categories_sidebar.html -->
{% load lex_tags %}

<div class="list-group">
    {% if arg1 %}
    <div class="alert alert-info small p-2 mb-2">
        {{ arg1 }}
    </div>
    {% endif %}

    {% for category in categories %}
    <a href="{% url 'lex:news_by_category' category.id %}"
       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center
              {% if active_category == category.id %}active{% endif %}">
        {{ category.name }}
        <span class="badge {% if active_category == category.id %}bg-light text-dark{% else %}bg-primary{% endif %} rounded-pill">
            {{ category.news_set.count }}
        </span>
    </a>
    {% empty %}
    <p class="text-muted">Категории не найдены</p>
    {% endfor %}

    {% get_news_count as total_news %}
    <div class="mt-3 text-muted small">
        Всего новостей: {{ total_news }}
    </div>
</div>
