<!-- lex/templates/lex/base.html -->
{% load static %}  <!-- НОВЫЙ ТЕГ для работы со статическими файлами -->

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Подключение локального Bootstrap CSS (ЛАБОРАТОРНАЯ №10) -->
    <link href="{% static 'lex/css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Подключение собственного CSS файла (ЛАБОРАТОРНАЯ №10) -->
    <link rel="stylesheet" href="{% static 'lex/css/style.css' %}">

    <title>{% block title %}Приложение Lex{% endblock %}</title>
</head>
<body>
    <!-- Навигация -->
    {% include 'inc/_nav.html' %}

    <div class="container container-custom">
        <!-- Заголовок страницы -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card bg-light">
                    <div class="card-body">
                        <h1 class="card-title text-center">
                            {% block header %}🏠 Приложение Lex{% endblock %}
                        </h1>
                    </div>
                </div>
            </div>
        </div>

        <!-- Двухколоночная структура -->
        <div class="row">
            <!-- Сайдбар -->
            <div class="col-md-4">
                {% block sidebar %}
                    {% include 'inc/_sidebar.html' %}
                {% endblock %}
            </div>

            <!-- Контент -->
            <div class="col-md-8">
                {% block content %}
                {% endblock %}
            </div>
        </div>

        <!-- Футер -->
        {% include 'inc/_footer.html' %}
    </div>

    <!-- Подключение локального Bootstrap JS (ЛАБОРАТОРНАЯ №10) -->
    <script src="{% static 'lex/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
